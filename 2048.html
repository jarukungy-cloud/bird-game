<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>2048</title>
<meta name="theme-color" content="#1b1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --ink: #1f2420; --label: #3c4a6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #1b1d22; font-family: system-ui, -apple-system, "Segoe UI", "Leelawadee UI", Tahoma, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  body { display: flex; justify-content: center; min-height: 100vh; min-height: 100dvh; }
  .dev {
    width: min(100vw, 480px); min-height: 100%;
    background: linear-gradient(170deg, #eee8d6, #d2c7a8);
    padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .back { font-size: 13px; font-weight: 700; color: var(--label); text-decoration: none; border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .1em; color: #222; }
  .scores { display: flex; gap: 8px; }
  .sc { background: #2c3e6e; color: #fff; border-radius: 8px; padding: 4px 10px; text-align: center; min-width: 66px; }
  .sc small { display: block; font-size: 10px; letter-spacing: .1em; opacity: .75; }
  .sc b { font-family: "Courier New", monospace; font-size: 17px; }
  .lcd {
    position: relative;
    background: radial-gradient(ellipse at 30% 20%, #d3d8bf, #bfc5a8 70%);
    border: 10px solid #2c3e6e; border-radius: 10px;
    padding: 10px; box-shadow: inset 0 2px 8px rgba(0,0,0,.35);
    touch-action: none;
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 62vh); margin: 0 auto; }
  .t {
    aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center;
    font-family: "Courier New", monospace; font-weight: 900; color: var(--ink);
    background: rgba(31,36,32,.07); font-size: min(9vw, 40px);
  }
  .t.d3 { font-size: min(7.5vw, 32px); } .t.d4 { font-size: min(6vw, 26px); } .t.d5 { font-size: min(4.8vw, 21px); }
  .v2 { background: #e2e6d3; } .v4 { background: #d3dabb; } .v8 { background: #bccaa0; } .v16 { background: #a5b886; }
  .v32 { background: #8ea66d; } .v64 { background: #779257; color: #fff; } .v128 { background: #5f7c43; color: #fff; }
  .v256 { background: #4b6735; color: #fff; } .v512 { background: #3a5329; color: #fff; } .v1024 { background: #2b4020; color: #fff; }
  .v2048 { background: #c41d2b; color: #fff; } .vbig { background: var(--ink); color: #fff; }
  .pop { animation: pop .16s ease-out; }
  .merge { animation: merge .18s ease-out; }
  @keyframes pop { from { transform: scale(.3); opacity: .2; } }
  @keyframes merge { 50% { transform: scale(1.14); } }
  .over {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(211,216,191,.88); border-radius: 2px; text-align: center; color: var(--ink); font-weight: 800; font-size: 18px;
  }
  .over.show { display: flex; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pill { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: #5b6f9c; color: #fff; font: inherit; font-size: 13px; font-weight: 800; box-shadow: 0 3px 0 #33415f; cursor: pointer; }
  .pill.go { background: #2f8f5b; box-shadow: 0 3px 0 #1c5a39; }
  .pill:active { transform: translateY(3px); box-shadow: none; }
  .pill:disabled { opacity: .45; }
  .help { color: var(--label); font-size: 13px; text-align: center; line-height: 1.45; margin: 0; }
</style>
</head>
<body>
<div class="dev">
  <div class="top">
    <a class="back" href="index.html">☰ เมนู</a>
    <div class="scores">
      <div class="sc"><small>SCORE</small><b id="score">0</b></div>
      <div class="sc"><small>BEST</small><b id="best">0</b></div>
    </div>
  </div>

  <div class="lcd" id="board">
    <div class="grid" id="grid"></div>
    <div class="over" id="over"><div id="overText"></div><div class="btns"><button class="pill" id="keep">เล่นต่อ</button><button class="pill go" id="again">เกมใหม่</button></div></div>
  </div>

  <div class="btns">
    <button class="pill" id="undo">↶ ย้อน</button>
    <button class="pill go" id="new">เกมใหม่</button>
  </div>
  <p class="help">ปัดนิ้ว ขึ้น/ลง/ซ้าย/ขวา (หรือปุ่มลูกศร) เลขเดียวกันชนกันจะรวมเป็นเลขใหม่<br>เกมบันทึกอัตโนมัติ ปิดแล้วกลับมาเล่นต่อได้</p>
</div>
<script>
'use strict';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const $ = id => document.getElementById(id);
const tiles = [];
for (let i = 0; i < 16; i++) { const d = document.createElement('div'); d.className = 't'; $('grid').appendChild(d); tiles.push(d); }

let g, score, prev, reached, best = store.get('g2048-best', 0);
const saved = store.get('g2048-state', null);
if (saved && Array.isArray(saved.g) && saved.g.length === 16) ({ g, score, prev, reached } = saved);
else newGame(false);

function newGame(draw = true) {
  g = new Array(16).fill(0); score = 0; prev = null; reached = false;
  const a = addTile(), b = addTile();
  if (draw) { save(); render([a, b], []); }
}
function addTile() {
  const empty = g.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  if (!empty.length) return -1;
  const i = empty[Math.floor(Math.random() * empty.length)];
  g[i] = Math.random() < 0.9 ? 2 : 4;
  return i;
}
function lines(dir) {
  const L = [];
  for (let a = 0; a < 4; a++) {
    const l = [];
    for (let b = 0; b < 4; b++) {
      const [x, y] = dir === 'left' ? [b, a] : dir === 'right' ? [3 - b, a] : dir === 'up' ? [a, b] : [a, 3 - b];
      l.push(y * 4 + x);
    }
    L.push(l);
  }
  return L;
}
function move(dir) {
  const before = g.slice(), beforeScore = score, merged = [];
  for (const l of lines(dir)) {
    const vals = l.map(i => g[i]).filter(v => v), out = [];
    for (let k = 0; k < vals.length; k++) {
      if (vals[k] === vals[k + 1]) { out.push(vals[k] * 2); score += vals[k] * 2; merged.push(l[out.length - 1]); k++; }
      else out.push(vals[k]);
    }
    l.forEach((i, k) => { g[i] = out[k] || 0; });
  }
  if (g.every((v, i) => v === before[i])) return;
  prev = { g: before, score: beforeScore };
  const added = addTile();
  if (score > best) { best = score; store.set('g2048-best', best); }
  save();
  render([added], merged);
  try { navigator.vibrate && navigator.vibrate(6); } catch (e) {}
  if (!reached && g.some(v => v >= 2048)) { reached = true; save(); showOver('ถึง 2048 แล้ว! 🎉', true); }
  else if (!canMove()) showOver('ไม่มีช่องให้เดินแล้ว', false);
}
function canMove() {
  if (g.some(v => !v)) return true;
  for (let i = 0; i < 16; i++) {
    if (i % 4 < 3 && g[i] === g[i + 1]) return true;
    if (i < 12 && g[i] === g[i + 4]) return true;
  }
  return false;
}
function showOver(text, canKeep) {
  $('overText').textContent = text;
  $('keep').hidden = !canKeep;
  $('over').classList.add('show');
}
function save() { store.set('g2048-state', { g, score, prev, reached }); }
function render(added = [], merged = []) {
  tiles.forEach((t, i) => {
    const v = g[i];
    t.className = 't' + (v ? (v > 2048 ? ' vbig' : ' v' + v) : '') + (v >= 100 ? ' d' + Math.min(5, String(v).length) : '');
    t.textContent = v || '';
    if (added.includes(i)) { void t.offsetWidth; t.classList.add('pop'); }
    else if (merged.includes(i)) { void t.offsetWidth; t.classList.add('merge'); }
  });
  $('score').textContent = score;
  $('best').textContent = best;
  $('undo').disabled = !prev;
}

// input: swipe on the board, arrow keys / WASD
let sx = null, sy = null;
const board = $('board');
board.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
board.addEventListener('pointerup', e => {
  if (sx === null || $('over').classList.contains('show')) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = sy = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
board.addEventListener('pointercancel', () => { sx = sy = null; });
const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
document.addEventListener('keydown', e => {
  const d = KEYS[e.key]; if (!d) return;
  e.preventDefault();
  if (!$('over').classList.contains('show')) move(d);
});

$('undo').onclick = () => {
  if (!prev) return;
  g = prev.g; score = prev.score; prev = null;
  $('over').classList.remove('show'); save(); render();
};
$('new').onclick = $('again').onclick = () => { $('over').classList.remove('show'); newGame(); };
$('keep').onclick = () => $('over').classList.remove('show');

render();
if (!canMove()) showOver('ไม่มีช่องให้เดินแล้ว', false);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
