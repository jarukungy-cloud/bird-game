<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zombie Survival</title>
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; color: #eee; font-family: system-ui, -apple-system, "Segoe UI", "Leelawadee UI", Tahoma, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  .wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud { position: absolute; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
  .hpbox { width: min(40vw, 200px); }
  .hp { height: 12px; border-radius: 7px; background: rgba(255,255,255,.15); overflow: hidden; box-shadow: 0 0 0 1.5px rgba(0,0,0,.6); }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg, #c41d2b, #ef5b5b); transition: width .15s; }
  .lbl { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-shadow: 0 1px 2px #000; margin-top: 4px; }
  .mid { flex: 1; text-align: center; font-weight: 800; font-size: 13px; text-shadow: 0 1px 2px #000; line-height: 1.35; }
  .mid b { font-size: 15px; }
  .ico { pointer-events: auto; width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; cursor: pointer; }

  .acts { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 38vh); display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
  .act { border: 0; border-radius: 16px; background: rgba(20,24,34,.72); color: #fff; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 0 0 1.5px rgba(255,255,255,.18); touch-action: none; }
  .act.nade { width: 62px; height: 62px; border-radius: 50%; font-size: 22px; line-height: 1; }
  .act.nade small { display: block; font-size: 11px; margin-top: 2px; }
  .act.gun { padding: 8px 12px; font-size: 12px; min-width: 92px; text-align: center; }
  .act.gun b { display: block; font-size: 15px; }
  .act:active { transform: scale(.94); }

  .banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 30px; font-weight: 900; letter-spacing: .1em; color: #fff; text-shadow: 0 0 14px #c41d2b, 0 2px 0 #000; pointer-events: none; opacity: 0; transition: opacity .35s; }
  .banner small { display: block; font-size: 15px; letter-spacing: .04em; margin-top: 6px; color: #ffd27a; text-shadow: 0 1px 3px #000; }
  .banner.show { opacity: 1; }

  .ov { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; background: rgba(5,7,12,.82); text-align: center; overflow-y: auto; }
  .ov.show { display: flex; }
  .ov h1 { margin: 0; font-size: clamp(28px, 8vw, 44px); letter-spacing: .08em; color: #e9f5d8; text-shadow: 0 0 18px #4f8f3a, 0 3px 0 #000; }
  .ov h2 { margin: 0; font-size: 24px; }
  .ov p { margin: 0; font-size: 14px; line-height: 1.6; color: #cfd6e4; max-width: 420px; }
  .btn { height: 46px; padding: 0 28px; border: 0; border-radius: 999px; background: #c41d2b; color: #fff; font: inherit; font-size: 16px; font-weight: 900; box-shadow: 0 4px 0 #7d0a12; cursor: pointer; }
  .btn.alt { background: #3a4660; box-shadow: 0 4px 0 #222a3a; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tog { height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #2a3142; color: #cfd6e4; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .tog.on { background: #2f8f5b; color: #fff; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
  .card { width: min(190px, 42vw); padding: 14px 10px; border: 0; border-radius: 16px; background: #1d2433; color: #fff; font: inherit; cursor: pointer; box-shadow: 0 0 0 2px #3c4a6b, 0 6px 0 #0d1119; }
  .card:active { transform: translateY(3px); }
  .card .e { font-size: 30px; }
  .card b { display: block; font-size: 15px; margin: 6px 0 4px; }
  .card span { font-size: 12.5px; color: #b9c3d8; }
  .stats { font-family: "Courier New", monospace; font-size: 15px; font-weight: 800; color: #ffd27a; line-height: 1.6; }
  a.menu { color: #9fb2d8; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="hpbox"><div class="hp"><i id="hp"></i></div><div class="lbl" id="wave">WAVE 1</div></div>
    <div class="mid"><b id="left">0</b> 🧟 เหลือ<br><span id="score">0</span> คะแนน</div>
    <button class="ico" id="pauseBtn" aria-label="หยุด">⏸</button>
  </div>

  <div class="acts" id="acts">
    <button class="act gun" id="gunBtn"><b id="gunName">ปืนพก</b><span id="gunAmmo">∞</span></button>
    <button class="act nade" id="nadeBtn">💣<small id="nadeN">3</small></button>
  </div>

  <div class="banner" id="banner"></div>

  <div class="ov show" id="ov"></div>
</div>

<script>
'use strict';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const lightCv = document.createElement('canvas'), lctx = lightCv.getContext('2d');
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const WORLD = 1600;
const VIEW = 460;                     // world units across the shorter screen side

// ---------- settings ----------
const opt = {
  sound: store.get('zs-sound', true),
  autoAim: store.get('zs-auto', true),
  dark: store.get('zs-dark', true),
};
let best = store.get('zs-best', { wave: 0, score: 0 });

// ---------- audio ----------
let ac = null, noiseBuf = null;
function ensureAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function noise(dur, freq, vol, q = 1) {
  if (!opt.sound || !ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  s.buffer = noiseBuf; s.loop = true;
  f.type = 'lowpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function tone(f, dur, type = 'square', vol = 0.05, delay = 0, slide = 0) {
  if (!opt.sound || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  pistol:  () => { noise(.12, 2400, .22); tone(180, .06, 'square', .04, 0, -100); },
  shotgun: () => { noise(.3, 1300, .35); tone(90, .15, 'sawtooth', .06, 0, -50); },
  smg:     () => noise(.07, 3000, .14),
  hit:     () => tone(220, .04, 'square', .025, 0, -120),
  die:     () => tone(120, .25, 'sawtooth', .05, 0, -70),
  hurt:    () => { tone(150, .18, 'square', .07, 0, -80); },
  boom:    () => { noise(.9, 500, .55); tone(60, .5, 'sine', .25, 0, -30); },
  pick:    () => { tone(880, .05, 'square', .04); tone(1320, .08, 'square', .04, .05); },
  groan:   () => tone(rnd(70, 110), .7, 'sawtooth', .025, 0, rnd(-30, 20)),
  wave:    () => [392, 523, 659, 784].forEach((f, i) => tone(f, .14, 'square', .05, i * .12)),
  click:   () => tone(1400, .02, 'square', .03),
  gameover:() => [330, 262, 196, 131].forEach((f, i) => tone(f, .3, 'sawtooth', .05, i * .25)),
};

// ---------- data ----------
const WEAPONS = {
  pistol:  { name: 'ปืนพก',  rate: .30, dmg: 24, spd: 720, spread: .04, pellets: 1, snd: 'pistol' },
  shotgun: { name: 'ลูกซอง', rate: .80, dmg: 15, spd: 650, spread: .34, pellets: 7, snd: 'shotgun', pick: 8,  start: 24 },
  smg:     { name: 'ปืนกล',  rate: .085, dmg: 13, spd: 780, spread: .13, pellets: 1, snd: 'smg',     pick: 45, start: 150 },
};
const ZT = {
  walker: { hp: 50,   spd: 46, r: 13, dmg: 10, pts: 10,  body: '#5f8a49', head: '#7fa866' },
  runner: { hp: 32,   spd: 98, r: 11, dmg: 8,  pts: 15,  body: '#8a5a43', head: '#a8785e' },
  ghost:  { hp: 40,   spd: 64, r: 12, dmg: 10, pts: 15,  ghost: true },
  brute:  { hp: 320,  spd: 34, r: 21, dmg: 25, pts: 60,  body: '#3f5f4f', head: '#5c8070' },
  boss:   { hp: 1800, spd: 44, r: 34, dmg: 30, pts: 500, body: '#5b3f7f', head: '#7d5ea3' },
};
const UPGRADES = [
  { e: '💥', name: 'กระสุนแรงขึ้น',  desc: 'ดาเมจ +20%',               apply: () => { P.dmgMul *= 1.2; } },
  { e: '⚡', name: 'ยิงไวขึ้น',      desc: 'อัตรายิง +15%',            apply: () => { P.rateMul *= 0.87; } },
  { e: '❤️', name: 'ร่างกายแกร่ง',   desc: 'เลือดสูงสุด +25 และฟื้นเต็ม', apply: () => { P.maxHp += 25; P.hp = P.maxHp; } },
  { e: '👟', name: 'รองเท้าวิ่ง',     desc: 'เดินเร็วขึ้น +10%',          apply: () => { P.speedMul *= 1.1; } },
  { e: '🎯', name: 'กระสุนทะลุ',     desc: 'ทะลุศัตรูเพิ่ม 1 ตัว',       apply: () => { P.pierce++; } },
  { e: '💣', name: 'ลังระเบิด',       desc: 'ระเบิด +3 ลูก',             apply: () => { P.nades += 3; } },
  { e: '🩹', name: 'ยาฟื้นฟู',        desc: 'ฟื้นเลือดเอง +1 ต่อวินาที',   apply: () => { P.regen += 1; } },
  { e: '🧲', name: 'แม่เหล็ก',        desc: 'ดูดของจากระยะไกลขึ้น',      apply: () => { P.magnet += 70; } },
  { e: '📦', name: 'กระเป๋ากระสุน',   desc: 'เติมกระสุนทุกปืนเต็มกระเป๋า', apply: () => { for (const w of P.weapons) if (WEAPONS[w].start) P.ammo[w] += WEAPONS[w].start; } },
];

// ---------- world ----------
let obstacles = [];
function buildWorld() {
  obstacles = [];
  const add = (type, r) => {
    for (let tries = 0; tries < 50; tries++) {
      const x = rnd(80, WORLD - 80), y = rnd(80, WORLD - 80);
      if (Math.hypot(x - WORLD / 2, y - WORLD / 2) < 170) continue;
      if (obstacles.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 46)) continue;
      obstacles.push({ type, x, y, r, rot: rnd(-.15, .15) });
      return;
    }
  };
  for (let i = 0; i < 5; i++) add('crypt', 38);
  for (let i = 0; i < 16; i++) add('tree', 15);
  for (let i = 0; i < 46; i++) add('tomb', 12);
}
let groundPat = null;
function makeGround() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#1f2d1b'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 14; i++) {
    g.fillStyle = `rgba(${rnd(40, 60)},${rnd(35, 45)},${rnd(20, 30)},.35)`;
    g.beginPath(); g.ellipse(rnd(0, 256), rnd(0, 256), rnd(10, 30), rnd(6, 18), rnd(0, 3), 0, TAU); g.fill();
  }
  for (let i = 0; i < 420; i++) {
    g.strokeStyle = Math.random() < .5 ? 'rgba(70,105,55,.55)' : 'rgba(20,30,16,.6)';
    g.lineWidth = 1;
    const x = rnd(0, 256), y = rnd(0, 256);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-2, 2), y - rnd(2, 5)); g.stroke();
  }
  groundPat = ctx.createPattern(c, 'repeat');
}

// ---------- state ----------
let P, zombies, bullets, parts, blood, pickups, nades, flashes;
let wave, toSpawn, spawnT, kills, score, state = 'title', shake, time = 0, groanT = 0, bossAlive = null;
let cam = { x: WORLD / 2, y: WORLD / 2 };
let gameId = 0;

function newGame() {
  P = {
    x: WORLD / 2, y: WORLD / 2, r: 12, hp: 100, maxHp: 100, speedMul: 1, dmgMul: 1, rateMul: 1, pierce: 0,
    nades: 3, regen: 0, magnet: 60, weapons: ['pistol'], wi: 0, ammo: { shotgun: 0, smg: 0 },
    cd: 0, inv: 0, aim: 0, firing: false, walk: 0,
  };
  zombies = []; bullets = []; parts = []; blood = []; pickups = []; nades = []; flashes = [];
  wave = 0; toSpawn = 0; spawnT = 0; kills = 0; score = 0; shake = 0; bossAlive = null; gameId++;
  buildWorld();
  cam.x = P.x; cam.y = P.y;
  startWave(1);
}

function startWave(n) {
  wave = n;
  toSpawn = 6 + n * 4;
  spawnT = 1.5;
  state = 'play';
  if (n % 5 === 0) { toSpawn = Math.round(toSpawn * 0.6); const gid = gameId; setTimeout(() => { if (gid === gameId && wave === n && (state === 'play' || state === 'pause')) spawnZombie('boss'); }, 2500); }
  showBanner('WAVE ' + n, n % 5 === 0 ? '⚠️ บอสกำลังมา!' : '');
  sfx.wave();
}

function pickType() {
  const o = [['walker', 10]];
  if (wave >= 2) o.push(['runner', 3 + wave]);
  if (wave >= 3) o.push(['ghost', 2 + wave * .5]);
  if (wave >= 4) o.push(['brute', 1 + wave * .35]);
  let r = Math.random() * o.reduce((s, x) => s + x[1], 0);
  for (const [t, w] of o) { if ((r -= w) <= 0) return t; }
  return 'walker';
}
function spawnZombie(type) {
  const T = ZT[type];
  let x, y;
  for (let tries = 0; tries < 20; tries++) {
    const a = rnd(0, TAU), d = rnd(520, 680);
    x = clamp(P.x + Math.cos(a) * d, 30, WORLD - 30);
    y = clamp(P.y + Math.sin(a) * d, 30, WORLD - 30);
    if (Math.hypot(x - P.x, y - P.y) > 380) break;
  }
  const hpMul = 1 + (wave - 1) * 0.08;
  const z = {
    type, x, y, r: T.r, hp: T.hp * hpMul, maxHp: T.hp * hpMul, spd: T.spd * rnd(.9, 1.12), dmg: T.dmg, pts: T.pts,
    ghost: !!T.ghost, atk: 0, flash: 0, kx: 0, ky: 0, wob: rnd(0, TAU), charge: 0, chargeT: 4,
  };
  zombies.push(z);
  if (type === 'boss') { bossAlive = z; shake = 10; sfx.groan(); }
}

// ---------- input ----------
const keys = new Set();
const stick = { move: null, aim: null };   // {id, ox, oy, x, y}
const mouse = { x: 0, y: 0, down: false, active: false };
const STICK_R = 56;

function stickVec(s) {
  if (!s) return { x: 0, y: 0, m: 0 };
  let dx = s.x - s.ox, dy = s.y - s.oy;
  const d = Math.hypot(dx, dy), m = Math.min(1, d / STICK_R);
  if (d > 0) { dx /= d; dy /= d; }
  return { x: dx * m, y: dy * m, m };
}
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (e.pointerType === 'mouse') { mouse.down = true; mouse.active = true; mouse.x = e.clientX; mouse.y = e.clientY; return; }
  const s = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
  if (e.clientX < innerWidth / 2) { if (!stick.move) stick.move = s; else return; }
  else { if (!stick.aim) stick.aim = s; else return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; return; }
  for (const k of ['move', 'aim']) {
    const s = stick[k];
    if (s && s.id === e.pointerId) {
      s.x = e.clientX; s.y = e.clientY;
      // let the move stick base follow the thumb so it never feels stuck
      const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy);
      if (k === 'move' && d > STICK_R * 1.4) { s.ox = s.x - dx / d * STICK_R * 1.4; s.oy = s.y - dy / d * STICK_R * 1.4; }
    }
  }
});
const endPtr = e => {
  if (e.pointerType === 'mouse') { mouse.down = false; return; }
  for (const k of ['move', 'aim']) if (stick[k] && stick[k].id === e.pointerId) stick[k] = null;
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys.add(k);
  if (k === 'q' || k === 'e' || k === 'tab') { e.preventDefault(); switchWeapon(); }
  if (k === 'g' || k === ' ') { e.preventDefault(); throwNade(); }
  if (k === 'escape' || k === 'p') togglePause();
});
document.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

$('gunBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); ensureAudio(); switchWeapon(); });
$('nadeBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); ensureAudio(); throwNade(); });
$('pauseBtn').addEventListener('click', () => togglePause());

function switchWeapon() {
  if (state !== 'play' || P.weapons.length < 2) return;
  for (let i = 1; i <= P.weapons.length; i++) {
    const w = P.weapons[(P.wi + i) % P.weapons.length];
    if (w === 'pistol' || P.ammo[w] > 0) { P.wi = P.weapons.indexOf(w); sfx.click(); return; }
  }
}
function throwNade() {
  if (state !== 'play' || P.nades <= 0) return;
  P.nades--;
  const sp = 420;
  nades.push({ x: P.x, y: P.y, vx: Math.cos(P.aim) * sp, vy: Math.sin(P.aim) * sp, t: 0.85 });
  sfx.click();
}

// ---------- helpers ----------
function screenToWorld(sx, sy) {
  const r = cv.getBoundingClientRect();
  const z = zoomCss();
  return { x: (sx - r.left - r.width / 2) / z + cam.x, y: (sy - r.top - r.height / 2) / z + cam.y };
}
const zoomCss = () => Math.min(cv.clientWidth, cv.clientHeight) / VIEW;
function nearestZombie(maxD) {
  let best = null, bd = maxD;
  for (const z of zombies) { const d = Math.hypot(z.x - P.x, z.y - P.y); if (d < bd) { bd = d; best = z; } }
  return best;
}
function pushOut(e, ghost) {
  e.x = clamp(e.x, e.r + 4, WORLD - e.r - 4);
  e.y = clamp(e.y, e.r + 4, WORLD - e.r - 4);
  if (ghost) return;
  for (const o of obstacles) {
    const dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy), min = o.r + e.r;
    if (d < min && d > 0.01) { e.x = o.x + dx / d * min; e.y = o.y + dy / d * min; }
  }
}
function addBlood(x, y, n, color = '#5a0b0b') {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(40, 200);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.25, .6), max: .6, c: color === 'ghost' ? '#cfe8ff' : '#9b1212', s: rnd(1.5, 3.5) });
  }
  if (color !== 'ghost') {
    blood.push({ x: x + rnd(-6, 6), y: y + rnd(-6, 6), r: rnd(6, 13), a: rnd(0, TAU) });
    if (blood.length > 220) blood.shift();
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}

function hurtZombie(z, dmg, kx, ky) {

  sfx.die();

  if (z.type === 'boss') { drop('med'); drop('nade'); drop('nade'); drop('ammo'); drop('ammo'); bossAlive = null; shake = 14; }
  else {

}

function explode(x, y) {

  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  flashes.push({ x, y, r: 260, t: .35, max: .35 });
  for (let i = 0; i < 46; i++) {
    const a = rnd(0, TAU), s = rnd(60, 380);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.3, .8), max: .8, c: i % 3 ? '#ffb347' : '#ff5a1f', s: rnd(2, 5) });
  }

    const d = Math.hypot(z.x - x, z.y - y);

// ---------- update ----------
function update(dt) {

  if (keys.has('d') || keys.has('arrowright')) mx += 1;
  if (keys.has('w') || keys.has('arrowup')) my -= 1;
  if (keys.has('s') || keys.has('arrowdown')) my += 1;
  const mv = stickVec(stick.move);
  if (mv.m > 0.12) { mx = mv.x; my = mv.y; }
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  const spd = 150 * P.speedMul;
  P.x += mx * spd * dt; P.y += my * spd * dt;
  P.walk += Math.hypot(mx, my) * dt * 10;
  pushOut(P, false);

  // aiming: right stick > mouse > auto-aim
  const av = stickVec(stick.aim);
  P.firing = false;
  if (av.m > 0.25) { P.aim = Math.atan2(av.y, av.x); P.firing = true; }
  else if (mouse.active && matchMedia('(pointer: fine)').matches) {
    const w = screenToWorld(mouse.x, mouse.y);
    P.aim = Math.atan2(w.y - P.y, w.x - P.x); P.firing = mouse.down;
  }
  if (!P.firing && opt.autoAim && !stick.aim) {
    const z = nearestZombie(340);
    if (z) { P.aim = Math.atan2(z.y - P.y, z.x - P.x); P.firing = true; }
    else if (ml > 0.1) P.aim = Math.atan2(my, mx);
  } else if (!P.firing && ml > 0.1 && !mouse.active) P.aim = Math.atan2(my, mx);

  // shooting
  P.cd -= dt;
  let wname = P.weapons[P.wi];
  if (wname !== 'pistol' && P.ammo[wname] <= 0) { P.wi = 0; wname = 'pistol'; }
  const W = WEAPONS[wname];
  if (P.firing && P.cd <= 0) {
    P.cd = W.rate * P.rateMul;
    if (wname !== 'pistol') P.ammo[wname]--;
    for (let i = 0; i < W.pellets; i++) {
      const a = P.aim + rnd(-W.spread, W.spread) * (W.pellets > 1 ? 1 : 0.5) + (W.pellets > 1 ? 0 : rnd(-W.spread, W.spread) * .5);
      const s = W.spd * rnd(.92, 1.05);
      bullets.push({ x: P.x + Math.cos(P.aim) * 16, y: P.y + Math.sin(P.aim) * 16, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .55, dmg: W.dmg * P.dmgMul, pierce: P.pierce, hit: [] });
    }
    sfx[W.snd]();
    flashes.push({ x: P.x + Math.cos(P.aim) * 20, y: P.y + Math.sin(P.aim) * 20, r: 120, t: .06, max: .06 });

  }

  P.inv = Math.max(0, P.inv - dt);

  // bullets
  for (const b of bullets) {
    const ox = b.x, oy = b.y;

    for (const o of obstacles) {
      if (Math.hypot(b.x - o.x, b.y - o.y) < o.r) {
        b.life = 0;
        for (let i = 0; i < 4; i++) parts.push({ x: b.x, y: b.y, vx: rnd(-90, 90), vy: rnd(-90, 90), life: .2, max: .2, c: '#d8d2b8', s: 1.6 });

    }
    if (b.life <= 0) continue;
    for (const z of zombies) {
      if (z.dead || b.hit.includes(z)) continue;
      // swept hit test: distance from zombie centre to this frame's bullet path
      const sx = b.x - ox, sy = b.y - oy, L = sx * sx + sy * sy || 1;
      const t = clamp(((z.x - ox) * sx + (z.y - oy) * sy) / L, 0, 1);
      if (Math.hypot(ox + sx * t - z.x, oy + sy * t - z.y) < z.r + 2) {
        const sp = Math.hypot(b.vx, b.vy);
        hurtZombie(z, b.dmg, b.vx / sp * 70, b.vy / sp * 70);
        addBlood(z.x, z.y, 3, z.ghost ? 'ghost' : null);
        sfx.hit();

        if (b.pierce-- <= 0) { b.life = 0; break; }
      }

  }

  // grenades
  for (const n of nades) {
    n.x += n.vx * dt; n.y += n.vy * dt; n.vx *= Math.pow(0.12, dt); n.vy *= Math.pow(0.12, dt); n.t -= dt;
    for (const o of obstacles) if (Math.hypot(n.x - o.x, n.y - o.y) < o.r + 4) { n.vx *= -0.4; n.vy *= -0.4; }

  }

  // spawning
  if (toSpawn > 0) {

    if (spawnT <= 0 && zombies.length < 45 + wave * 2) {
      spawnZombie(pickType()); toSpawn--;
      spawnT = Math.max(0.3, 1.35 - wave * 0.07) * rnd(.6, 1.3);
    }
  }

  // zombies
  for (const z of zombies) {
    if (z.dead) continue;
    z.wob += dt * (z.spd / 14);
    z.flash = Math.max(0, z.flash - dt);
    const dx = P.x - z.x, dy = P.y - z.y, d = Math.hypot(dx, dy) || 1;
    let sp = z.spd;
    if (z.type === 'boss') {
      z.chargeT -= dt;
      if (z.charge > 0) { z.charge -= dt; sp = 280; }
      else if (z.chargeT <= 0) { z.chargeT = rnd(4, 6); z.charge = -0.8; }
      if (z.charge < 0) { z.charge += dt; sp = 0; if (z.charge >= 0) { z.charge = 0.7; z.cdx = dx / d; z.cdy = dy / d; sfx.groan(); } }
    }
    let vx = dx / d * sp, vy = dy / d * sp;
    if (z.type === 'boss' && z.charge > 0) { vx = z.cdx * sp; vy = z.cdy * sp; }
    z.x += (vx + z.kx) * dt; z.y += (vy + z.ky) * dt;
    z.kx *= Math.pow(0.002, dt); z.ky *= Math.pow(0.002, dt);
    pushOut(z, z.ghost);
    z.atk -= dt;
    if (d < z.r + P.r + 3 && z.atk <= 0) {
      z.atk = 0.8;
      if (P.inv <= 0) {

        sfx.hurt(); addBlood(P.x, P.y, 6);

      }
    }
  }

  for (let i = 0; i < zombies.length; i++) {
    const a = zombies[i];
    for (let j = i + 1; j < zombies.length; j++) {
      const b = zombies[j];
      if (a.ghost !== b.ghost) continue;
      const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
      if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
      const d = Math.hypot(dx, dy);

  }
  zombies = zombies.filter(z => !z.dead);

  // pickups
  for (const p of pickups) {
    p.t -= dt;

    if (d < P.magnet) { p.x += dx / d * 260 * dt; p.y += dy / d * 260 * dt; }

      }

  // particles + flashes
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt); p.life -= dt; }

}

function drawZombie(z) {

  ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(a + wob);
  if (z.ghost) {
    ctx.globalAlpha = 0.72 + Math.sin(time * 6 + z.wob) * 0.1;

    ctx.arc(2, 0, z.r, -Math.PI / 2, Math.PI / 2);
    for (let i = 0; i <= 4; i++) ctx.lineTo(-z.r - 6 + Math.sin(time * 10 + i) * 2, z.r - i * (z.r / 2));

function draw() {

  // darkness with a flashlight cone
  if (opt.dark) {
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, W, H);
    lctx.fillStyle = 'rgba(3,5,12,0.87)'; lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';
    worldTransform(lctx, sx, sy);
    let g = lctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, 135);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.55, 'rgba(0,0,0,.75)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.beginPath(); lctx.arc(P.x, P.y, 135, 0, TAU); lctx.fill();
    g = lctx.createRadialGradient(P.x, P.y, 20, P.x, P.y, 360);
    g.addColorStop(0, 'rgba(0,0,0,.95)'); g.addColorStop(.7, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.beginPath(); lctx.moveTo(P.x, P.y); lctx.arc(P.x, P.y, 360, P.aim - 0.45, P.aim + 0.45); lctx.closePath(); lctx.fill();
    for (const f of flashes) {
      const k = f.t / f.max;
      g = lctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, `rgba(0,0,0,${k})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g; lctx.beginPath(); lctx.arc(f.x, f.y, f.r, 0, TAU); lctx.fill();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lightCv, 0, 0);
    worldTransform(ctx, sx, sy);
  }
  // muzzle/explosion glow and eyes shine through the dark
  for (const f of flashes) {
    const k = f.t / f.max;
    ctx.fillStyle = `rgba(255,200,90,${0.35 * k})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.25, 0, TAU); ctx.fill();
  }
  for (const zz of zombies) if (onScreen(zz.x, zz.y)) drawEyes(zz);

  // screen-space: joysticks + boss bar
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const k of ['move', 'aim']) {
    const s = stick[k]; if (!s) continue;
    const r = cv.getBoundingClientRect();
    const ox = (s.ox - r.left) * dpr, oy = (s.oy - r.top) * dpr, v = stickVec(s);
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2 * dpr;
    ctx.beginPath(); ctx.arc(ox, oy, STICK_R * dpr, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = k === 'aim' ? 'rgba(230,57,70,.7)' : 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(ox + v.x * STICK_R * dpr, oy + v.y * STICK_R * dpr, 24 * dpr, 0, TAU); ctx.fill();
  }
  if (bossAlive) {
    const w = Math.min(W * 0.7, 420 * dpr), x = (W - w) / 2, y = H - 40 * dpr;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y, w, 10 * dpr);
    ctx.fillStyle = '#a04ae0'; ctx.fillRect(x, y, w * Math.max(0, bossAlive.hp / bossAlive.maxHp), 10 * dpr);
    ctx.fillStyle = '#fff'; ctx.font = `bold ${12 * dpr}px system-ui`; ctx.textAlign = 'center';
    ctx.fillText('👹 ราชาซอมบี้', W / 2, y - 6 * dpr);
  }
}

// ---------- HUD + overlays ----------
const cache = {};
function setText(id, v) { if (cache[id] !== v) { cache[id] = v; $(id).textContent = v; } }
function hud() {
  if (!P) return;
  $('hp').style.width = Math.max(0, P.hp / P.maxHp * 100) + '%';
  setText('wave', `WAVE ${wave}  ·  ❤ ${Math.ceil(Math.max(0, P.hp))}/${P.maxHp}`);
  setText('left', String(toSpawn + zombies.length + (bossPending() ? 1 : 0)));
  setText('score', score.toLocaleString());
  const w = P.weapons[P.wi];
  setText('gunName', WEAPONS[w].name + (P.weapons.length > 1 ? ' ⇄' : ''));
  setText('gunAmmo', w === 'pistol' ? '∞' : String(P.ammo[w]));
  setText('nadeN', String(P.nades));
}

let bannerTimer = null;
function showBanner(t, sub = '') {
  const b = $('banner');
  b.innerHTML = '';
  b.append(t);
  if (sub) { const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
  b.classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => b.classList.remove('show'), 1800);
}

const ov = $('ov');
function overlay(html) { ov.innerHTML = html; ov.classList.add('show'); }
function hideOverlay() { ov.classList.remove('show'); }

function toggles() {
  return `<div class="row">
    <button class="tog ${opt.autoAim ? 'on' : ''}" data-t="autoAim">🎯 เล็งอัตโนมัติ</button>
    <button class="tog ${opt.dark ? 'on' : ''}" data-t="dark">🔦 โหมดมืด</button>
    <button class="tog ${opt.sound ? 'on' : ''}" data-t="sound">🔊 เสียง</button>
  </div>`;
}
ov.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) {
    const k = t.dataset.t; opt[k] = !opt[k];
    store.set({ autoAim: 'zs-auto', dark: 'zs-dark', sound: 'zs-sound' }[k], opt[k]);
    t.classList.toggle('on', opt[k]);
    ensureAudio(); return;
  }
  const a = e.target.closest('[data-a]');
  if (!a) return;
  ensureAudio();
  const act = a.dataset.a;
  if (act === 'start') { hideOverlay(); bossSeen = false; newGame(); wake(); }
  else if (act === 'resume') { hideOverlay(); state = 'play'; wake(); }
  else if (act === 'up') {
    const u = offered[+a.dataset.i];
    if (u) u.apply();
    hideOverlay(); bossSeen = false;
    startWave(wave + 1);
  }
});

function titleScreen() {
  overlay(`<h1>🧟 ZOMBIE<br>SURVIVAL</h1>
    <p>รอดชีวิตในป่าช้ากลางคืนให้นานที่สุด<br>
    <b>นิ้วซ้าย</b> ลากเพื่อเดิน · <b>นิ้วขวา</b> ลากเพื่อเล็งและยิง<br>
    💣 ปาระเบิด · ⇄ สลับปืน · เก็บกระสุน ยา และระเบิดที่ตกจากซอมบี้<br>
    ทุก 5 ระลอกจะเจอบอส!</p>
    ${best.wave ? `<div class="stats">สถิติ: WAVE ${best.wave} · ${best.score.toLocaleString()} คะแนน</div>` : ''}
    ${toggles()}
    <button class="btn" data-a="start">เริ่มเกม</button>
    <a class="menu" href="index.html">☰ กลับเมนูเกม</a>`);
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    stick.move = stick.aim = null; keys.clear(); mouse.down = false;
    overlay(`<h2>หยุดชั่วคราว</h2>${toggles()}
      <div class="row"><button class="btn" data-a="resume">เล่นต่อ</button><button class="btn alt" data-a="start">เริ่มใหม่</button></div>
      <a class="menu" href="index.html">☰ กลับเมนูเกม</a>`);
  } else if (state === 'pause') { hideOverlay(); state = 'play'; }
}

let offered = [];
function showUpgrades() {
  if (state !== 'clear') return;
  state = 'upgrade';
  let unlock = '';
  if (wave === 1 && !P.weapons.includes('shotgun')) { P.weapons.push('shotgun'); P.ammo.shotgun += WEAPONS.shotgun.start; unlock = '🎁 ได้ปืนลูกซอง! กดปุ่มปืนเพื่อสลับ'; }
  if (wave === 3 && !P.weapons.includes('smg')) { P.weapons.push('smg'); P.ammo.smg += WEAPONS.smg.start; unlock = '🎁 ได้ปืนกล! กดปุ่มปืนเพื่อสลับ'; }
  P.hp = Math.min(P.maxHp, P.hp + 15);
  offered = UPGRADES.slice().sort(() => Math.random() - .5).slice(0, 3);
  overlay(`<h2>WAVE ${wave} ผ่านแล้ว!</h2>
    ${unlock ? `<p style="color:#ffd27a;font-weight:800">${unlock}</p>` : ''}
    <p>เลือกอัปเกรด 1 อย่าง (ฟื้นเลือด +15 ให้แล้ว)</p>
    <div class="cards">${offered.map((u, i) => `<button class="card" data-a="up" data-i="${i}"><div class="e">${u.e}</div><b>${u.name}</b><span>${u.desc}</span></button>`).join('')}</div>`);
}

function gameOver() {
  state = 'over';
  sfx.gameover();
  try { navigator.vibrate && navigator.vibrate([100, 60, 200]); } catch (e) {}
  const rec = wave > best.wave || (wave === best.wave && score > best.score);
  if (rec) { best = { wave, score }; store.set('zs-best', best); }
  setTimeout(() => overlay(`<h1>คุณถูกกิน! 🧟</h1>
    <div class="stats">รอดถึง WAVE ${wave}<br>ฆ่าซอมบี้ ${kills} ตัว · ${score.toLocaleString()} คะแนน</div>
    <p>${rec ? '🏆 สถิติใหม่!' : `สถิติ: WAVE ${best.wave} · ${best.score.toLocaleString()} คะแนน`}</p>
    <div class="row"><button class="btn" data-a="start">เล่นอีกครั้ง</button></div>
    <a class="menu" href="index.html">☰ กลับเมนูเกม</a>`), 900);
}

let wl = null;
async function wake() {
  try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {}
}

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(1 / 30, (t - last) / 1000); last = t;
  update(dt);
  if (bossAlive) bossSeen = true;
  draw(); hud();
  requestAnimationFrame(frame);
}

resize();
makeGround();
buildWorld();
titleScreen();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
