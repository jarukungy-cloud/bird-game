<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bird Feeder</title>
<meta name="theme-color" content="#1b1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bird Feeder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --sw: min(94vw, 620px, 80vh);
    --big: min(19vw, 11vh, 92px);
    --label: #3c4a6b;
  }
  @supports (height: 1dvh) { :root { --sw: min(94vw, 620px, 80dvh); --big: min(19vw, 11dvh, 92px); } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1b1d22;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  body { display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; }

  .device {
    width: min(100vw, 680px); height: 100%; max-height: 940px;
    background: linear-gradient(170deg, #eee8d6, #d2c7a8);
    border-radius: 28px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-areas: "brand brand brand" "screen screen screen" "hint hint hint" "lb mid rb";
    grid-template-rows: auto auto auto 1fr;
    align-items: center; justify-items: center;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -4px 0 rgba(0,0,0,.1);
  }
  @media (max-width: 700px) { .device { border-radius: 0; } }

  .brand { grid-area: brand; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .logo { border: 2px solid #222; border-radius: 6px; padding: 2px 8px; font-weight: 900; font-size: 13px; line-height: 1.05; color: #222; background: #f7f3e8; }
  .logo small { display: block; font-size: 9px; letter-spacing: .1em; }
  .other { font-size: 12px; font-weight: 700; color: var(--label); text-decoration: none; border: 1.5px solid currentColor; border-radius: 999px; padding: 4px 10px; }

  .frame {
    grid-area: screen;
    padding: calc(var(--sw) * .03);
    background: #2c3e6e;
    border-radius: 10px;
    box-shadow: 0 0 0 4px #c8bfa3, 0 0 0 6px #9f957a;
  }
  canvas {
    display: block; width: var(--sw); aspect-ratio: 480 / 300;
    border-radius: 4px; touch-action: none;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.4);
  }

  .hint { grid-area: hint; color: var(--label); font-size: 13px; font-weight: 600; text-align: center; min-height: 2.8em; padding: 12px 6px 0; line-height: 1.35; }

  .col { display: flex; flex-direction: column; gap: calc(var(--big) * .35); align-items: center; }
  .lb { grid-area: lb; } .rb { grid-area: rb; }
  .bigwrap { position: relative; display: flex; align-items: center; gap: 8px; }
  .arrow { width: 0; height: 0; border: 9px solid transparent; }
  .lb .arrow { border-right-color: #222; border-left-width: 0; }
  .rb .arrow { border-left-color: #222; border-right-width: 0; }
  .lb .up .arrow, .rb .up .arrow { transform: rotate(var(--rot)); }
  .lb .up { --rot: 25deg; } .lb .dn { --rot: -25deg; }
  .rb .up { --rot: -25deg; } .rb .dn { --rot: 25deg; }
  .arrow { transform: rotate(var(--rot)); }
  .rb .bigwrap { flex-direction: row-reverse; }

  button { touch-action: none; cursor: pointer; padding: 0; font: inherit; border: 0; }
  .big {
    width: var(--big); height: var(--big); border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #ff6b6b, #c41d2b 68%);
    box-shadow: 0 0 0 calc(var(--big) * .1) #2a2d33, 0 5px 0 calc(var(--big) * .1) #15171a, 0 8px 12px rgba(0,0,0,.35);
  }
  .mid { grid-area: mid; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; padding: 0 6px; }
  .pill {
    min-width: 64px; height: 30px; padding: 0 10px; border-radius: 999px;
    background: #5b6f9c; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .05em;
    box-shadow: 0 3px 0 #33415f;
  }
  .pill.ga { background: #2f8f5b; box-shadow: 0 3px 0 #1c5a39; }
  .pill.gb { background: #c0702a; box-shadow: 0 3px 0 #7a4417; }
  .pressed { transform: translateY(3px); filter: brightness(.9); }
  .pill.pressed { box-shadow: 0 0 0 transparent; }

  @media (orientation: landscape) and (max-height: 560px) {
    :root { --sw: min(58vw, (100vh - 120px) * 1.6); --big: min(20vh, 11vw, 88px); }
    @supports (height: 1dvh) { :root { --sw: min(58vw, (100dvh - 120px) * 1.6); --big: min(20dvh, 11vw, 88px); } }
    .device {
      width: 100vw; max-height: none; border-radius: 0;
      grid-template-areas: "lb screen rb" "lb hint rb" "lb mid rb";
      grid-template-rows: auto auto auto; align-content: center;
      padding: 6px max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
    }
    .brand { display: none; }
    .hint { min-height: 0; padding-top: 6px; font-size: 12px; }
    .mid { grid-template-columns: repeat(4, auto); margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="device">
  <div class="brand">
    <div class="logo">GAME<small>&amp; WATCH</small></div>
    <a class="other" href="brick.html">🧱 Brick Game</a>
  </div>

  <div class="frame"><canvas id="cv"></canvas></div>

  <div class="hint" id="hint"></div>

  <div class="col lb">
    <div class="bigwrap up"><button class="big" data-b="p0" aria-label="ซ้ายบน"></button><span class="arrow"></span></div>
    <div class="bigwrap dn"><button class="big" data-b="p1" aria-label="ซ้ายล่าง"></button><span class="arrow"></span></div>
  </div>

  <div class="mid">
    <button class="pill ga" data-b="A">GAME A</button>
    <button class="pill gb" data-b="B">GAME B</button>
    <button class="pill" data-b="pause">PAUSE</button>
    <button class="pill" data-b="sound" id="sndBtn">SOUND</button>
  </div>

  <div class="col rb">
    <div class="bigwrap up"><button class="big" data-b="p2" aria-label="ขวาบน"></button><span class="arrow"></span></div>
    <div class="bigwrap dn"><button class="big" data-b="p3" aria-label="ขวาล่าง"></button><span class="arrow"></span></div>
  </div>
</div>

<script>
'use strict';
// Poses / ramps: 0 = left-up, 1 = left-down, 2 = right-up, 3 = right-down
const LW = 480, LH = 300;
const ON = '#1f2420', OFF = 'rgba(31,36,32,0.075)';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- sound ----------
let ac = null, sound = store.get('bf-sound', true);
function ensureAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function beep(f, d = 0.05, delay = 0, vol = 0.05) {
  if (!sound || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + d + 0.02);
}
function tune(notes) { let t = 0; for (const [f, d] of notes) { beep(f, d, t); t += d; } }
const sfx = {
  tick:  r => beep([1180, 990, 1320, 880][r], .025, 0, .03),
  move:  () => beep(440, .015, 0, .025),
  catch: () => beep(1760, .06),
  up:    () => tune([[1047, .06], [1319, .06], [1568, .1]]),
  bonus: () => tune([[784, .08], [988, .08], [1175, .08], [1568, .16]]),
  miss:  () => tune([[392, .12], [330, .12], [262, .2]]),
  over:  () => tune([[523, .14], [392, .14], [330, .14], [262, .4]]),
  start: () => tune([[880, .06], [1175, .1]]),
  sel:   () => beep(880, .03),
};

// ---------- state ----------
let state = 'boot';            // boot | idle | play | pause | miss | over
let mode = 'A', pose = 0, foods = [], score = 0, misses = 0, level = 1;
let tickN = 0, lastSpawn = -9, acc = 0, missT = 0, missSide = 0, feedN = 0, bootT = 0, demoT = 0, now = 0;
const hi = { A: store.get('bf-hi-A', 0), B: store.get('bf-hi-B', 0) };
const blinkOn = () => Math.floor(now / 250) % 2 === 0;
// each caught worm is carried to a chick: in the beak -> flying to the nest -> in the chick's mouth
let feeds = [];
const FEED_BEAK = 250, FEED_FLY = 600, FEED_END = 1000;

const levelFor = () => Math.min(20, 1 + Math.floor(score / 15) + (mode === 'B' ? 3 : 0));
const interval = () => Math.max(160, 600 - (level - 1) * 30);

function startGame(m) {
  mode = m; score = 0; misses = 0; foods = []; feeds = [];
  level = levelFor(); tickN = 0; lastSpawn = -9; acc = 0;
  state = 'play'; sfx.start(); wake();
}

function tick() {
  tickN++;
  for (const f of foods) f.s++;
  const arrived = foods.filter(f => f.s >= 5);
  foods = foods.filter(f => f.s < 5);

  for (const f of arrived) {
    if (f.r !== pose) { miss(f.r); return; }
    score++; sfx.catch();
    feeds.push({ pose, chick: feedN++ % 3, t: 0, chirped: false });
    if (score === 200 || score === 500) { misses = 0; sfx.bonus(); }
    const nl = levelFor();
    if (nl > level) { level = nl; if (score !== 200 && score !== 500) sfx.up(); }
  }
  for (const f of foods) sfx.tick(f.r);

  // at most one new worm per tick, so no two ever reach the end together
  const gap = level < 4 ? 2 : 1;
  const maxF = Math.min(4, 1 + Math.floor(level / 2));
  const p = Math.min(0.9, 0.45 + level * 0.04);
  if (tickN - lastSpawn > gap && foods.length < maxF && (foods.length === 0 || Math.random() < p)) {
    foods.push({ r: Math.floor(Math.random() * 4), s: 0 });
    lastSpawn = tickN;
  }
}

function miss(r) {
  misses++; missSide = r < 2 ? 0 : 1; missT = 0; foods = [];
  state = 'miss'; sfx.miss();
  try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
}

function endGame() {
  state = 'over';
  if (score > hi[mode]) { hi[mode] = score; store.set('bf-hi-' + mode, score); }
  sfx.over();
}

// ---------- input ----------
function setPose(r) {
  if (state !== 'play' && state !== 'miss') return;
  if (r !== pose) { pose = r; sfx.move(); }
}
function press(b) {
  ensureAudio();
  if (state === 'boot') return;
  if (b[0] === 'p' && b.length === 2) {
    if (state === 'idle' || state === 'over') { startGame('A'); setPose(+b[1]); return; }
    setPose(+b[1]); return;
  }
  if (b === 'A' || b === 'B') { if (state === 'play' || state === 'miss') return; startGame(b); return; }
  if (b === 'pause') {
    if (state === 'play') state = 'pause';
    else if (state === 'pause') { state = 'play'; wake(); }
    sfx.sel(); return;
  }
  if (b === 'sound') { sound = !sound; store.set('bf-sound', sound); sfx.sel(); }
}

document.querySelectorAll('button[data-b]').forEach(el => {
  const b = el.dataset.b;
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('pressed'); press(b); });
  const end = () => el.classList.remove('pressed');
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
});
document.addEventListener('contextmenu', e => e.preventDefault());

// tap the screen itself: each quarter is one position
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const left = e.clientX - r.left < r.width / 2, up = e.clientY - r.top < r.height * 0.55;
  press('p' + ((left ? 0 : 2) + (up ? 0 : 1)));
});

const KEYS = { q: 'p0', 7: 'p0', a: 'p1', 1: 'p1', p: 'p2', 9: 'p2', l: 'p3', 3: 'p3', g: 'A', b: 'B', m: 'sound' };
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  const side = pose < 2 ? 0 : 1, up = pose % 2 === 0;
  let b = KEYS[k];
  if (e.key === 'ArrowLeft') b = 'p' + (up ? 0 : 1);
  else if (e.key === 'ArrowRight') b = 'p' + (up ? 2 : 3);
  else if (e.key === 'ArrowUp') b = 'p' + (side ? 2 : 0);
  else if (e.key === 'ArrowDown') b = 'p' + (side ? 3 : 1);
  else if (e.key === ' ' || e.key === 'Enter') b = (state === 'idle' || state === 'over') ? mode : 'pause';
  if (!b) return;
  e.preventDefault(); press(b);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

let wl = null;
async function wake() {
  try {
    if ('wakeLock' in navigator && !wl) {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  } catch (e) {}
}

// ---------- drawing ----------
let scale = 1;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  scale = cv.width / LW;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
resize();

function seg(on, fn) { ctx.fillStyle = ctx.strokeStyle = on ? ON : OFF; fn(); }
function mirrored(side, fn) {
  if (!side) { fn(); return; }
  ctx.save(); ctx.translate(LW, 0); ctx.scale(-1, 1); fn(); ctx.restore();
}
const RAMP = [ // left side; right side is mirrored
  { x0: 26, y0: 70, x1: 165, y1: 110 },
  { x0: 26, y0: 148, x1: 165, y1: 186 },
];
function foodPos(r, s) {
  const R = RAMP[r % 2], t = 0.1 + s * 0.2;
  return { x: R.x0 + (R.x1 - R.x0) * t, y: R.y0 + (R.y1 - R.y0) * t - 9 };
}

function printed() {
  // LCD background
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#d5d9c4'); g.addColorStop(1, '#c3c8ae');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);

  for (const side of [0, 1]) mirrored(side, () => {
    // trunk
    ctx.fillStyle = 'rgba(139,94,52,.45)';
    ctx.fillRect(4, 30, 20, 270);
    // leaves
    ctx.fillStyle = 'rgba(96,150,82,.45)';
    for (const [x, y, r] of [[10, 22, 30], [44, 12, 22], [30, 44, 20], [62, 30, 16]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
    // branches
    ctx.strokeStyle = 'rgba(139,94,52,.55)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (const R of RAMP) { ctx.beginPath(); ctx.moveTo(R.x0 - 4, R.y0 + 3); ctx.lineTo(R.x1 + 2, R.y1 + 3); ctx.stroke(); }
    // grass tufts
    ctx.strokeStyle = 'rgba(96,150,82,.5)'; ctx.lineWidth = 2;
    for (const gx of [60, 100, 140]) for (const d of [-5, 0, 5]) { ctx.beginPath(); ctx.moveTo(gx, 296); ctx.lineTo(gx + d, 286); ctx.stroke(); }
  });
  // nest
  ctx.fillStyle = 'rgba(150,108,62,.5)';
  ctx.beginPath(); ctx.ellipse(240, 252, 58, 30, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(110,76,40,.45)'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(186 + i * 6, 256 + (i % 2) * 6); ctx.lineTo(244 + i * 9, 262 - (i % 3) * 4); ctx.stroke(); }
  // labels
  ctx.fillStyle = 'rgba(31,36,32,.55)';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.fillText('MISS', 336, 60);
  ctx.fillText('LV', 128, 40);
}

function drawWorm(r, s) {
  const p = foodPos(r, s);
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let k = 0; k <= 6; k++) {
    const x = p.x - 9 + k * 3, y = p.y + Math.sin(k * 1.3 + s * 1.7) * 3;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.beginPath(); ctx.arc(p.x - 10, p.y + Math.sin(s * 1.7) * 3, 3.5, 0, 7); ctx.fill();
}

const LIGHT = '#ccd1ba';
function drawMother(r, on) {
  // a round, chubby bird; for the upper branch she hops up with a wing raised
  const up = r % 2 === 0, bx = 190, by = up ? 111 : 187;
  const hx = bx - 14, hy = by - 14;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // tail
  ctx.beginPath(); ctx.ellipse(bx + 22, by - 2, 11, 5.5, -0.45, 0, 7); ctx.fill();
  // body + head
  ctx.beginPath(); ctx.ellipse(bx, by, 22, 18, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(hx, hy, 14, 0, 7); ctx.fill();
  // little head feather
  ctx.beginPath(); ctx.ellipse(hx + 4, hy - 15, 2.6, 5.5, 0.5, 0, 7); ctx.fill();
  // small soft beak
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx - 11, hy - 4); ctx.lineTo(hx - 23, hy + 1); ctx.lineTo(hx - 11, hy + 5); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (up) {
    ctx.beginPath(); ctx.ellipse(bx + 9, by - 21, 14, 7, -0.9, 0, 7); ctx.fill();
  } else {
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(bx - 6, by + 16); ctx.lineTo(bx - 7, by + 24); ctx.moveTo(bx + 6, by + 16); ctx.lineTo(bx + 7, by + 24); ctx.stroke();
  }
  if (!on) return;
  ctx.fillStyle = ctx.strokeStyle = LIGHT;
  // big round eye with a sparkle
  ctx.beginPath(); ctx.arc(hx - 3, hy - 3, 4.2, 0, 7); ctx.fill();
  ctx.fillStyle = ON; ctx.beginPath(); ctx.arc(hx - 4, hy - 2.6, 2.3, 0, 7); ctx.fill();
  ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.arc(hx - 4.8, hy - 3.6, 0.9, 0, 7); ctx.fill();
  // cheek, belly, wing line
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(hx + 3, hy + 6, 4, 2.5, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.3;
  ctx.beginPath(); ctx.ellipse(bx - 7, by + 6, 10, 8, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx - 3, by - 3); ctx.quadraticCurveTo(bx + 6, by + 13, bx + 16, by + 2); ctx.stroke();
}

function drawChick(i) {
  const x = 222 + i * 18, y = 242;
  ctx.beginPath(); ctx.arc(x, y, 8.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y - 8, 2.4, 0, 7); ctx.fill();
  ctx.fillStyle = LIGHT;
  ctx.beginPath(); ctx.arc(x - 3, y - 1, 1.6, 0, 7); ctx.arc(x + 3, y - 1, 1.6, 0, 7); ctx.fill();
}
function drawChickMouth(i) {
  const x = 222 + i * 18, y = 242;
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - 5, y - 17); ctx.lineTo(x, y - 9); ctx.lineTo(x + 5, y - 17); ctx.stroke();
}

function wiggle(x, y, len, vertical) {
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let k = 0; k <= 4; k++) {
    const a = -len / 2 + k * len / 4, b = Math.sin(k * 1.6) * 2.5;
    const px = vertical ? x + b : x + a, py = vertical ? y + a : y + b;
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s);
  ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.4, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.4, x + s * 1.6, y - s * 0.2, x, y + s);
  ctx.fill();
}
function drawFeeds() {
  ctx.fillStyle = ctx.strokeStyle = ON;
  for (const f of feeds) {
    const side = f.pose >> 1, up = f.pose % 2 === 0;
    const bx = side ? LW - 152 : 152, by = (up ? 111 : 187) - 12;   // beak tip
    const cx = 222 + f.chick * 18, cy = 228;                          // chick's mouth
    if (f.t < FEED_BEAK) {
      wiggle(bx, by + 8, 12, true);                                   // dangling from the beak
    } else if (f.t < FEED_FLY) {
      const k = Math.min(2, Math.floor((f.t - FEED_BEAK) / (FEED_FLY - FEED_BEAK) * 3));
      const tt = (k + 1) / 4;                                         // three G&W-style hops
      wiggle(bx + (cx - bx) * tt, by + (cy - by) * tt - 34 * Math.sin(Math.PI * tt), 12, false);
    } else {
      wiggle(cx, cy - 12, 9, true);                                   // in the chick's mouth
      if (blinkOn()) heart(cx, cy - 30, 4.5);
    }
  }
}

function drawSplat() {
  // worm on the ground under the branches, plus little shock lines
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(98, 284); ctx.quadraticCurveTo(108, 274, 116, 284); ctx.quadraticCurveTo(124, 292, 132, 282); ctx.stroke();
  ctx.lineWidth = 2.5;
  for (const [x1, y1, x2, y2] of [[96, 266, 90, 256], [114, 262, 114, 250], [132, 266, 138, 256]]) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
}

function drawMissIcon(i) {
  const x = 340 + i * 20, y = 34;
  ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 7, y - 1); ctx.lineTo(x - 14, y + 1); ctx.lineTo(x - 7, y + 3); ctx.fill();
}

const SEG7 = [0x3f, 0x06, 0x5b, 0x4f, 0x66, 0x6d, 0x7d, 0x07, 0x7f, 0x6f];
function digit(x, y, w, h, n, all) {
  const m = n == null ? 0 : SEG7[n], t = Math.max(2, w * 0.2), hh = h / 2;
  const R = [
    [x + t / 2, y, w - t, t], [x + w - t, y + t / 2, t, hh - t], [x + w - t, y + hh + t / 2, t, hh - t],
    [x + t / 2, y + h - t, w - t, t], [x, y + hh + t / 2, t, hh - t], [x, y + t / 2, t, hh - t],
    [x + t / 2, y + hh - t / 2, w - t, t],
  ];
  R.forEach((r, i) => seg(all || (m >> i) & 1, () => ctx.fillRect(r[0] + 0.6, r[1] + 0.6, r[2] - 1.2, r[3] - 1.2)));
}
function number(v, x, y, w, h, count, gap, all) {
  const s = String(v);
  for (let i = 0; i < count; i++) {
    const ch = s[s.length - count + i];
    digit(x + i * (w + gap), y, w, h, ch === undefined ? null : +ch, all);
  }
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  printed();
  const all = state === 'boot';
  const live = state !== 'idle';

  for (let r = 0; r < 4; r++) for (let s = 0; s < 5; s++) {
    const on = all || foods.some(f => f.r === r && f.s === s);
    mirrored(r >> 1, () => seg(on, () => drawWorm(r, s)));
  }
  for (let r = 0; r < 4; r++) {
    const on = all || r === pose;
    mirrored(r >> 1, () => seg(on, () => drawMother(r, on)));
  }
  for (const side of [0, 1]) {
    const on = all || (state === 'miss' && missSide === side && blinkOn()) || (state === 'over' && missSide === side);
    mirrored(side, () => seg(on, drawSplat));
  }
  for (let i = 0; i < 3; i++) {
    seg(true, () => drawChick(i));
    const eating = feeds.some(f => f.chick === i && f.t >= FEED_FLY);
    const hungry = state === 'play' && tickN % 3 === i;
    seg(all || eating || hungry, () => drawChickMouth(i));
  }
  drawFeeds();
  for (let i = 0; i < 3; i++) seg(all || misses > i, () => drawMissIcon(i));

  const shown = state === 'idle' ? hi[mode] : score;
  number(shown, 206, 14, 18, 32, 3, 6, all);
  number(state === 'idle' ? '' : level, 148, 18, 11, 22, 2, 4, all);

  ctx.font = 'bold 13px system-ui, sans-serif';
  const aOn = all || (live ? mode === 'A' : mode === 'A' && blinkOn());
  const bOn = all || (live ? mode === 'B' : mode === 'B' && blinkOn());
  seg(aOn, () => ctx.fillText('GAME A', 36, 292));
  seg(bOn, () => ctx.fillText('GAME B', 392, 292));
  seg(all || state === 'pause' && blinkOn(), () => ctx.fillText('PAUSE', 218, 70));
}

// ---------- hint text ----------
const hintEl = $('hint'), sndBtn = $('sndBtn');
function hintText() {
  switch (state) {
    case 'boot':  return '';
    case 'idle':  return `กด GAME A (ปกติ) หรือ GAME B (เร็ว) เพื่อเริ่ม · สถิติ A: ${hi.A} · B: ${hi.B}`;
    case 'play':
    case 'miss':  return 'ปุ่มแดง 4 ปุ่ม = ตำแหน่งแม่นก · คาบหนอนที่ปลายกิ่งไปป้อนลูกนก · หนอนตก 3 ครั้งจบเกม';
    case 'pause': return 'หยุดชั่วคราว — กด PAUSE เพื่อเล่นต่อ';
    case 'over':  return `GAME OVER · ได้ ${score} คะแนน (สถิติ ${hi[mode]}) — กด GAME A / GAME B เพื่อเล่นใหม่`;
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(100, t - last); last = t; now += dt;
  if (state !== 'pause') {
    for (const f of feeds) {
      f.t += dt;
      if (f.t >= FEED_FLY && !f.chirped) { f.chirped = true; tune([[2093, .04], [2637, .05]]); }
    }
    feeds = feeds.filter(f => f.t < FEED_END);
  }
  if (state === 'boot') {
    bootT += dt; if (bootT > 1200) state = 'idle';
  } else if (state === 'idle') {
    demoT += dt;
    if (demoT > 600) { demoT = 0; pose = [1, 3, 2, 0][pose]; }
  } else if (state === 'play') {
    acc += dt;
    while (acc >= interval() && state === 'play') { acc -= interval(); tick(); }
  } else if (state === 'miss') {
    missT += dt;
    if (missT > 1500) { if (misses >= 3) endGame(); else { state = 'play'; acc = 0; } }
  }
  draw();
  const h = hintText();
  if (hintEl._v !== h) { hintEl._v = h; hintEl.textContent = h; }
  sndBtn.style.opacity = sound ? 1 : .45;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
